# Exp 2: equal-budget acquisition, one round. Primary test of H1, H1b, H5. S7 (oracle) is run
# separately because it needs test data by design.
experiment:
  name: exp2_equal_budget
  kind: equal_budget
  regimes: [R1, R2]
  pipeline_seeds: [0, 1, 2, 3, 4]   # pilot; headline seed count fixed after the power analysis
  strategies: [S0, S1, S2, S2+, S3, S3b, S4, S4b, S5, S5-shuffled, S6]
  n0: 100
  budgets: [50, 100, 200]
  demo_equiv_steps: 100   # calibrate: mean accepted-demo length under uniform sampling
